<div class="min-h-screen flex items-center justify-center p-4 banner-sala !rounded-none">
  <form
    class="w-full max-w-sm bg-white text-slate-900 rounded-xl shadow-2xl p-8 space-y-4"
    (ngSubmit)="submit()"
  >
    <img src="img/alfa-games.jpg" alt="Alfa Games" class="mx-auto w-56 h-auto mix-blend-multiply" />
    <p class="text-sm text-slate-500 text-center">Ingresa con tu cuenta</p>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    @if (error()) {
      <p class="text-sm text-red-600">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="w-full rounded-lg bg-indigo-600 text-white font-medium py-2 hover:bg-indigo-700 disabled:opacity-50"
    >
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</div>
