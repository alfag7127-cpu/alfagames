<div class="min-h-screen flex items-center justify-center bg-slate-100">
  <form
    class="w-full max-w-sm bg-white rounded-xl shadow p-8 space-y-4"
    (ngSubmit)="submit()"
  >
    <div class="controller-wrap">
      <svg
        class="controller"
        viewBox="0 0 200 120"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="Control de videojuegos"
      >
        <path
          d="M60 30 H140 C168 30 188 52 184 78 C181 98 164 108 148 100 L134 90 H66 L52 100 C36 108 19 98 16 78 C12 52 32 30 60 30 Z"
          fill="#1e293b"
        />
        <!-- D-pad -->
        <rect x="38" y="56" width="9" height="26" rx="2" fill="#64748b" />
        <rect x="28" y="66" width="29" height="9" rx="2" fill="#64748b" />
        <!-- Face buttons -->
        <circle class="btn-triangle" cx="152" cy="52" r="6" fill="none" stroke="#5eead4" stroke-width="2" />
        <circle class="btn-circle" cx="166" cy="66" r="6" fill="none" stroke="#f87171" stroke-width="2" />
        <circle class="btn-cross" cx="152" cy="80" r="6" fill="none" stroke="#93c5fd" stroke-width="2" />
        <circle class="btn-square" cx="138" cy="66" r="6" fill="none" stroke="#f0abfc" stroke-width="2" />
        <!-- Sticks -->
        <circle cx="82" cy="70" r="11" fill="#334155" />
        <circle cx="82" cy="70" r="6" fill="#0f172a" />
        <circle cx="112" cy="88" r="11" fill="#334155" />
        <circle cx="112" cy="88" r="6" fill="#0f172a" />
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-slate-800 text-center">Alfa Games</h1>
    <p class="text-sm text-slate-500 text-center">Ingresa con tu cuenta</p>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Correo</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      />
    </div>

    @if (error()) {
      <p class="text-sm text-red-600">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="w-full rounded-lg bg-indigo-600 text-white font-medium py-2 hover:bg-indigo-700 disabled:opacity-50"
    >
      {{ loading() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</div>
