<div class="min-h-screen bg-slate-50">
  <nav class="bg-slate-900 text-white px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <span class="font-bold">Sala Gamer</span>
      <a
        routerLink="/sala"
        routerLinkActive="text-indigo-400"
        class="text-sm hover:text-indigo-300"
        >Sala</a
      >
      <a
        routerLink="/historial"
        routerLinkActive="text-indigo-400"
        class="text-sm hover:text-indigo-300"
        >Historial</a
      >
      @if (auth.isAdmin()) {
        <a
          routerLink="/dashboard"
          routerLinkActive="text-indigo-400"
          class="text-sm hover:text-indigo-300"
          >Dashboard</a
        >
        <a
          routerLink="/gastos"
          routerLinkActive="text-indigo-400"
          class="text-sm hover:text-indigo-300"
          >Gastos</a
        >
      }
    </div>
    <div class="flex items-center gap-4 text-sm">
      <span class="text-slate-300">{{ auth.currentProfile()?.full_name || auth.currentProfile()?.role }}</span>
      <button (click)="logout()" class="rounded bg-slate-700 px-3 py-1 hover:bg-slate-600">
        Salir
      </button>
    </div>
  </nav>

  <main class="p-6">
    <router-outlet />
  </main>
</div>
