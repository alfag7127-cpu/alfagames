<div class="min-h-screen bg-slate-100">
  <nav class="sticky top-0 z-30 bg-gradient-to-r from-slate-950 via-slate-900 to-indigo-950 text-white shadow-lg">
    <div class="flex items-center justify-between gap-3 px-4 sm:px-6 py-2">
      <a routerLink="/" class="flex items-center gap-2 shrink-0">
        <img
          src="img/alfa-frank-over.jpg"
          alt="Alfa Games"
          class="h-10 w-10 rounded-full ring-2 ring-sky-400/60 shadow-[0_0_14px_rgba(56,189,248,0.45)]"
        />
        <span class="hidden sm:block font-extrabold tracking-tight">
          Alfa <span class="text-sky-400">Games</span>
        </span>
      </a>

      <div class="flex items-center gap-3 text-sm shrink-0">
        <span class="hidden sm:block text-slate-300">{{ auth.currentProfile()?.full_name || auth.currentProfile()?.role }}</span>
        <button (click)="logout()" class="rounded-lg bg-white/10 px-3 py-1.5 hover:bg-white/20">Salir</button>
      </div>
    </div>

    <!-- Enlaces: se desplazan horizontalmente en el celular -->
    <div class="flex items-center gap-1 overflow-x-auto px-3 sm:px-5 pb-2 text-sm">
      <a routerLink="/sala" routerLinkActive="nav-activo" class="nav-link">🎮 Sala</a>
      <a routerLink="/alquiler" routerLinkActive="nav-activo" class="nav-link">🏠 Alquiler</a>
      <a routerLink="/historial" routerLinkActive="nav-activo" class="nav-link">📋 Historial</a>
      @if (auth.isAdmin()) {
        <a routerLink="/dashboard" routerLinkActive="nav-activo" class="nav-link">📊 Dashboard</a>
        <a routerLink="/gastos" routerLinkActive="nav-activo" class="nav-link">💸 Gastos</a>
        <a routerLink="/puestos" routerLinkActive="nav-activo" class="nav-link">🕹️ Puestos</a>
      }
    </div>
  </nav>

  <main class="p-4 sm:p-6 max-w-[1600px] mx-auto">
    <router-outlet />
  </main>
</div>
