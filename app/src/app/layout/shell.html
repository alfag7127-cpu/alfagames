<div class="min-h-screen bg-slate-50">
  <nav class="bg-slate-900 text-white px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <span class="flex items-center gap-2 font-bold">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="20" height="20" class="text-indigo-400">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 8h.01M6 12h4m8-2v4m-2-2h4M9.5 17h5a4.5 4.5 0 003.905-6.75L17 8a4 4 0 00-3.464-2H10.46A4 4 0 007 8l-1.405 2.25A4.5 4.5 0 009.5 17Z" />
        </svg>
        Alfa Games
      </span>
      <a
        routerLink="/sala"
        routerLinkActive="text-indigo-400"
        class="text-sm hover:text-indigo-300"
        >Sala</a
      >
      <a
        routerLink="/historial"
        routerLinkActive="text-indigo-400"
        class="text-sm hover:text-indigo-300"
        >Historial</a
      >
      @if (auth.isAdmin()) {
        <a
          routerLink="/dashboard"
          routerLinkActive="text-indigo-400"
          class="text-sm hover:text-indigo-300"
          >Dashboard</a
        >
        <a
          routerLink="/gastos"
          routerLinkActive="text-indigo-400"
          class="text-sm hover:text-indigo-300"
          >Gastos</a
        >
        <a
          routerLink="/puestos"
          routerLinkActive="text-indigo-400"
          class="text-sm hover:text-indigo-300"
          >Puestos</a
        >
      }
    </div>
    <div class="flex items-center gap-4 text-sm">
      <span class="text-slate-300">{{ auth.currentProfile()?.full_name || auth.currentProfile()?.role }}</span>
      <button (click)="logout()" class="rounded bg-slate-700 px-3 py-1 hover:bg-slate-600">
        Salir
      </button>
    </div>
  </nav>

  <main class="p-6">
    <router-outlet />
  </main>
</div>
